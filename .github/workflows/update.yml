# 每天台灣時間早上 8 點自動抓取實習職缺，更新 index.html（GitHub Pages 會顯示這個檔案）
name: 每日更新實習職缺

on:
  schedule:
    - cron: "0 0 * * *"      # UTC 00:00 = 台灣時間 08:00（GitHub 尖峰時段可能延後幾分鐘到幾十分鐘）
  workflow_dispatch:          # 在 Actions 頁面按「Run workflow」可以立即手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 抓取各系網站
        run: python thu_internships.py
      - name: 產生網頁
        run: cp internships.html index.html
      - name: 存回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html internships.html internships.csv
          git diff --cached --quiet || git commit -m "每日更新實習職缺 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase    # 執行期間如果有人上傳新檔案，先合併再存回，避免存回失敗
          git push
